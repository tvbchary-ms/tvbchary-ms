<svg width="72" height="72" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LangChain">
  <title>LangChain</title>
  <defs>
    <style>
      .ring-langchain {
        transform-origin: 50px 50px;
        animation: spin-langchain 4s linear infinite;
      }
      @keyframes spin-langchain {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .icon-langchain {
        transform-origin: 12px 12px;
        animation: pulse-langchain 2.4s ease-in-out infinite;
      }
      @keyframes pulse-langchain {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
    </style>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#1A1B26"/>
  <circle class="ring-langchain" cx="50" cy="50" r="46" fill="none" stroke="#7FC8FF" stroke-width="3" stroke-dasharray="30 250" stroke-linecap="round" opacity="0.9"/>
