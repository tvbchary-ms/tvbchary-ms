<svg width="72" height="72" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tailwind CSS">
  <title>Tailwind CSS</title>
  <defs>
    <style>
      .ring-tailwindcss {
        transform-origin: 50px 50px;
        animation: spin-tailwindcss 4s linear infinite;
      }
      @keyframes spin-tailwindcss {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .icon-tailwindcss {
        transform-origin: 12px 12px;
        animation: pulse-tailwindcss 2.4s ease-in-out infinite;
      }
      @keyframes pulse-tailwindcss {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
    </style>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#1A1B26"/>
  <circle class="ring-tailwindcss" cx="50" cy="50" r="46" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="30 250" stroke-linecap="round" opacity="0.9"/>
