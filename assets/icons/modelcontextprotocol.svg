<svg width="72" height="72" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Model Context Protocol">
  <title>Model Context Protocol</title>
  <defs>
    <style>
      .ring-modelcontextprotocol {
        transform-origin: 50px 50px;
        animation: spin-modelcontextprotocol 4s linear infinite;
      }
      @keyframes spin-modelcontextprotocol {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .icon-modelcontextprotocol {
        transform-origin: 12px 12px;
        animation: pulse-modelcontextprotocol 2.4s ease-in-out infinite;
      }
      @keyframes pulse-modelcontextprotocol {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
    </style>
  </defs>
