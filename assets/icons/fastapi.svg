<svg width="72" height="72" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FastAPI">
  <title>FastAPI</title>
  <defs>
    <style>
      .ring-fastapi {
        transform-origin: 50px 50px;
        animation: spin-fastapi 4s linear infinite;
      }
      @keyframes spin-fastapi {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .icon-fastapi {
        transform-origin: 12px 12px;
        animation: pulse-fastapi 2.4s ease-in-out infinite;
      }
      @keyframes pulse-fastapi {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
    </style>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#1A1B26"/>
  <circle class="ring-fastapi" cx="50" cy="50" r="46" fill="none" stroke="#009688" stroke-width="3" stroke-dasharray="30 250" stroke-linecap="round" opacity="0.9"/>
  <g transform="translate(25,25) scale(2.0833333)">
    <g class="icon-fastapi" fill="#009688">
      <path d="M12 .0387C5.3729.0384.0003 5.3931 0 11.9988c-.001 6.6066 5.372 11.9628 12 11.9625 6.628.0003 12.001-5.3559 12-11.9625-.0003-6.6057-5.3729-11.9604-12-11.96m-.829 5.4153h7.55l-7.5805 5.3284h5.1828L5.279 18.5436q2.9466-6.5444 5.892-13.0896"/>
    </g>
  </g>
</svg>
