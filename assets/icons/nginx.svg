<svg width="72" height="72" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nginx">
  <title>Nginx</title>
  <defs>
    <style>
      .ring-nginx {
        transform-origin: 50px 50px;
        animation: spin-nginx 4s linear infinite;
      }
      @keyframes spin-nginx {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .icon-nginx {
        transform-origin: 12px 12px;
        animation: pulse-nginx 2.4s ease-in-out infinite;
      }
      @keyframes pulse-nginx {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
    </style>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#1A1B26"/>
  <circle class="ring-nginx" cx="50" cy="50" r="46" fill="none" stroke="#009639" stroke-width="3" stroke-dasharray="30 250" stroke-linecap="round" opacity="0.9"/>
  <g transform="translate(25,25) scale(2.0833333)">
