<svg width="72" height="72" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terraform">
  <title>Terraform</title>
  <defs>
    <style>
      .ring-terraform {
        transform-origin: 50px 50px;
        animation: spin-terraform 4s linear infinite;
      }
      @keyframes spin-terraform {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .icon-terraform {
        transform-origin: 12px 12px;
        animation: pulse-terraform 2.4s ease-in-out infinite;
      }
      @keyframes pulse-terraform {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
    </style>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#1A1B26"/>
  <circle class="ring-terraform" cx="50" cy="50" r="46" fill="none" stroke="#7B42BC" stroke-width="3" stroke-dasharray="30 250" stroke-linecap="round" opacity="0.9"/>
  <g transform="translate(25,25) scale(2.0833333)">
    <g class="icon-terraform" fill="#7B42BC">
      <path d="M1.44 0v7.575l6.561 3.79V3.787zm21.12 4.227l-6.561 3.791v7.574l6.56-3.787zM8.72 4.23v7.575l6.561 3.787V8.018zm0 8.405v7.575L15.28 24v-7.578z"/>
    </g>
  </g>
</svg>
