<svg width="72" height="72" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Claude Code">
  <title>Claude Code</title>
  <defs>
    <style>
      .ring-claudecode {
        transform-origin: 50px 50px;
        animation: spin-claudecode 4s linear infinite;
      }
      @keyframes spin-claudecode {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .icon-claudecode {
        transform-origin: 12px 12px;
        animation: pulse-claudecode 2.4s ease-in-out infinite;
      }
      @keyframes pulse-claudecode {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
    </style>
  </defs>
