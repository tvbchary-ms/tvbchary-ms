<svg width="72" height="72" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ansible">
  <title>Ansible</title>
  <defs>
    <style>
      .ring-ansible {
        transform-origin: 50px 50px;
        animation: spin-ansible 4s linear infinite;
      }
      @keyframes spin-ansible {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .icon-ansible {
        transform-origin: 12px 12px;
        animation: pulse-ansible 2.4s ease-in-out infinite;
      }
      @keyframes pulse-ansible {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
    </style>
  </defs>
